<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ders Takip Paneli</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .badge-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .course-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .course-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--card-border);
    }

    .course-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .badge-math111 { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-math131 { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-phys101 { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }

    .topic-list {
      list-style: none;
    }

    .topic-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .topic-item:last-child {
      border-bottom: none;
    }

    .topic-info {
      flex: 1;
    }

    .topic-name {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .exam-tag {
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill-done { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .pill-inprogress { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
    .pill-notstarted { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }

    .prof-pin {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid var(--danger);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ders İlerleme Takibi</h1>
    <span class="badge-sub">GitHub Pages Senkronize Panel</span>
  </header>

  <div id="app"></div>

  <!-- Veri Dosyası (Önbellek engellemek için versiyon parametresi eklendi) -->
  <script src="curriculum.js?v=1"></script>

  <script>
    const app = document.getElementById('app');

    function getStatusPill(status) {
      if (status === 'done') return `<span class="pill pill-done">🟢 Tamam</span>`;
      if (status === 'inprogress') return `<span class="pill pill-inprogress">🟡 Çalışıyor</span>`;
      return `<span class="pill pill-notstarted">⚪ Bekliyor</span>`;
    }

    for (const [key, course] of Object.entries(trackerData)) {
      const card = document.createElement('div');
      card.className = 'course-card';

      card.innerHTML = `
        <div class="course-header">
          <span class="course-title">${course.title}</span>
          <span class="badge ${course.badgeClass}">Aktif</span>
        </div>
        <ul class="topic-list">
          ${course.topics.map(t => `
            <li class="topic-item">
              <div class="topic-info">
                <div class="topic-name">${t.name}</div>
                <span class="exam-tag">${t.exam}</span>
              </div>
              <div class="status-group">
                ${t.prof ? `<span class="prof-pin">📍 Hoca Burada</span>` : ''}
                ${getStatusPill(t.user)}
              </div>
            </li>
          `).join('')}
        </ul>
      `;

      app.appendChild(card);
    }
  </script>
</body>
</html>

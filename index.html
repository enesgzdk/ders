<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ders Takip Paneli</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --primary: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .top-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-config {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .sync-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
    }

    /* Ders Satırı (Dikey Sıralama) */
    .course-row {
      margin-bottom: 28px;
    }

    .course-title-bar {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Sağa Doğru Kaydırılabilir Konu Şeridi */
    .topic-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .topic-track::-webkit-scrollbar {
      height: 6px;
    }
    .topic-track::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    /* Konu Kartı (Tablo Hücresi Gibi) */
    .topic-cell {
      flex: 0 0 240px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      scroll-snap-align: start;
      position: relative;
    }

    .topic-cell.prof-active {
      border-color: rgba(239, 68, 68, 0.6);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.05) 0%, var(--card-bg) 100%);
    }

    .topic-name {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.35;
      min-height: 44px;
    }

    .topic-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .exam-tag {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .cell-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    select.user-select {
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      outline: none;
    }

    .btn-prof {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-prof.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: #f87171;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 12px; }
    .modal input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      outline: none;
    }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-btns button {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
    }
    .btn-save { background: var(--primary); color: #000; font-weight: 600; }
    .btn-cancel { background: #334155; color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Ders Takip Tablosu</h1>
      <span id="syncText" class="sync-status">Hazır</span>
    </div>
    <div class="top-controls">
      <button class="btn-config" onclick="openConfigModal()">⚙️ GitHub Bağlantısı</button>
    </div>
  </header>

  <div id="board">Yükleniyor...</div>

  <!-- Ayarlar Modal -->
  <div id="configModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2>GitHub Ayarları</h2>
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">
        Verilerin web üzerinden repoya kaydedilebilmesi için bilgilerinizi girin. Bu bilgiler yalnızca bu cihazın yerel belleğinde saklanır.
      </p>
      <input type="text" id="cfgUser" placeholder="GitHub Kullanıcı Adı">
      <input type="text" id="cfgRepo" placeholder="Repo Adı (örn: ders-takip)">
      <input type="password" id="cfgToken" placeholder="GitHub Personal Access Token (PAT)">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeConfigModal()">Kapat</button>
        <button class="btn-save" onclick="saveConfig()">Kaydet & Yükle</button>
      </div>
    </div>
  </div>

  <script>
    let trackerData = null;
    let fileSha = null;

    function getStorageConfig() {
      return {
        user: localStorage.getItem('gt_user') || '',
        repo: localStorage.getItem('gt_repo') || '',
        token: localStorage.getItem('gt_token') || ''
      };
    }

    function openConfigModal() {
      const cfg = getStorageConfig();
      document.getElementById('cfgUser').value = cfg.user;
      document.getElementById('cfgRepo').value = cfg.repo;
      document.getElementById('cfgToken').value = cfg.token;
      document.getElementById('configModal').style.display = 'flex';
    }

    function closeConfigModal() {
      document.getElementById('configModal').style.display = 'none';
    }

    function saveConfig() {
      localStorage.setItem('gt_user', document.getElementById('cfgUser').value.trim());
      localStorage.setItem('gt_repo', document.getElementById('cfgRepo').value.trim());
      localStorage.setItem('gt_token', document.getElementById('cfgToken').value.trim());
      closeConfigModal();
      loadData();
    }

    // GitHub'dan data.json dosyasını çekme
    async function loadData() {
      const cfg = getStorageConfig();
      const statusEl = document.getElementById('syncText');

      if (!cfg.user || !cfg.repo) {
        // Yapılandırma girilmediyse doğrudan repo kökünden okumayı dene
        try {
          const res = await fetch('data.json?v=' + Date.now());
          trackerData = await res.json();
          renderBoard();
          statusEl.textContent = 'Görüntüleme Modu (Kayıt için ⚙️ Ayarlayın)';
        } catch (e) {
          statusEl.textContent = 'Veri okunamadı. ⚙️ Ayarları yapın.';
        }
        return;
      }

      statusEl.textContent = 'Veriler alınıyor...';
      const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`;

      try {
        const headers = cfg.token ? { 'Authorization': `Bearer ${cfg.token}` } : {};
        const res = await fetch(url, { headers, cache: 'no-store' });
        
        if (!res.ok) throw new Error('Repo bulunamadı veya yetki hatası.');
        
        const fileInfo = await res.json();
        fileSha = fileInfo.sha;
        const decodedContent = decodeURIComponent(escape(atob(fileInfo.content)));
        trackerData = JSON.parse(decodedContent);
        renderBoard();
        statusEl.textContent = 'Senkronize Edildi ✓';
      } catch (err) {
        statusEl.textContent = 'Hata: ' + err.message;
      }
    }

    // GitHub'daki data.json dosyasını güncelleme
    async function syncToGitHub() {
      const cfg = getStorageConfig();
      const statusEl = document.getElementById('syncText');

      if (!cfg.user || !cfg.repo || !cfg.token) {
        alert('Değişikliklerin kaydedilmesi için lütfen ⚙️ butonundan GitHub bilgilerinizi ve Token girin.');
        openConfigModal();
        return;
      }

      statusEl.textContent = 'Kaydediliyor...';
      const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`;
      const jsonString = JSON.stringify(trackerData, null, 2);
      const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update study progress via web panel',
            content: encodedContent,
            sha: fileSha
          })
        });

        if (!res.ok) throw new Error('Kaydedilemedi (SHA uyuşmazlığı veya izin hatası).');
        
        const result = await res.json();
        fileSha = result.content.sha;
        statusEl.textContent = 'Değişiklikler Repoya Kaydedildi ✓';
      } catch (err) {
        statusEl.textContent = 'Kaydetme Hatası: ' + err.message;
        // Çakışma durumunda en güncel veriyi tekrar çek
        setTimeout(loadData, 2000);
      }
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      for (const [courseKey, course] of Object.entries(trackerData)) {
        const row = document.createElement('div');
        row.className = 'course-row';

        row.innerHTML = `
          <div class="course-title-bar">
            <span>${course.title}</span>
          </div>
          <div class="topic-track">
            ${course.topics.map(topic => `
              <div class="topic-cell ${topic.prof ? 'prof-active' : ''}">
                <div>
                  <div class="topic-meta">
                    <span class="exam-tag">${topic.exam}</span>
                  </div>
                  <div class="topic-name">${topic.name}</div>
                </div>
                <div class="cell-actions">
                  <select class="user-select" onchange="updateUserStatus('${courseKey}', '${topic.id}', this.value)">
                    <option value="notstarted" ${topic.user === 'notstarted' ? 'selected' : ''}>⚪ Başlamadım</option>
                    <option value="inprogress" ${topic.user === 'inprogress' ? 'selected' : ''}>🟡 Çalışıyorum</option>
                    <option value="done" ${topic.user === 'done' ? 'selected' : ''}>🟢 Tamam</option>
                  </select>
                  <button class="btn-prof ${topic.prof ? 'active' : ''}" onclick="toggleProfStatus('${courseKey}', '${topic.id}')">
                    ${topic.prof ? '📍 Hoca Burada' : 'Hoca İşaretle'}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        board.appendChild(row);
      }
    }

    function updateUserStatus(courseKey, topicId, status) {
      const t = trackerData[courseKey].topics.find(x => x.id === topicId);
      if (t) {
        t.user = status;
        syncToGitHub();
      }
    }

    function toggleProfStatus(courseKey, topicId) {
      const t = trackerData[courseKey].topics.find(x => x.id === topicId);
      if (t) {
        t.prof = !t.prof;
        renderBoard();
        syncToGitHub();
      }
    }

    // Sayfa açıldığında başlat
    loadData();
  </script>
</body>
</html>
